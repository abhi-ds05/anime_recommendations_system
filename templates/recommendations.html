<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anime Recommendation App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#212025] text-white min-h-screen flex flex-col items-center justify-start p-6">

  <div class="max-w-xl w-full bg-[#222] border border-[#444] rounded-xl shadow-2xl p-8 space-y-6">
    <h1 class="text-center text-4xl font-extrabold text-[#00ffcc] tracking-wide">Anime Recommendation</h1>

    <form id="recommendForm" class="space-y-5">
      <div>
        <label class="block mb-2 font-semibold text-gray-300" for="recommendation_type">
          Select Recommendation Type:
        </label>
        <select id="recommendation_type" name="recommendation_type" required
          class="w-full rounded-lg px-4 py-2 bg-[#333] border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#00cc99]">
          <option value="">-- Select --</option>
          <option value="item_based">Item-based</option>
        </select>
      </div>

      <div id="anime_name_input" class="hidden">
        <label class="block mb-2 font-semibold text-gray-300" for="anime_name">
          Enter Anime Name:
        </label>
        <input type="text" id="anime_name" name="anime_name" list="anime_list"
          class="w-full rounded-lg px-4 py-2 bg-[#333] border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#00cc99]" autocomplete="off"/>
        <datalist id="anime_list"></datalist>
      </div>

      <div id="num_recommendations_input" class="hidden">
        <label class="block mb-2 font-semibold text-gray-300" for="num_recommendations">
          Number of Recommendations:
        </label>
        <input type="number" id="num_recommendations" name="num_recommendations" value="10" min="1" max="50"
          class="w-full rounded-lg px-4 py-2 bg-[#333] border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#00cc99]" />
      </div>

      <button type="submit" id="submitBtn"
        class="w-full mt-4 bg-[#00cc99] text-black font-bold py-3 rounded-lg hover:bg-[#00b386] transition duration-300 ease-in-out transform hover:scale-105">
        Get Recommendations
      </button>
    </form>
  </div>

  <!-- Container for displaying loading message and recommendations -->
  <div id="recommendations" class="mt-10 max-w-2xl w-full space-y-6"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    // Show/hide inputs on selection
    document.getElementById("recommendation_type").addEventListener("change", function () {
      if (this.value) {
        document.getElementById("anime_name_input").classList.remove("hidden");
        document.getElementById("num_recommendations_input").classList.remove("hidden");
      } else {
        document.getElementById("anime_name_input").classList.add("hidden");
        document.getElementById("num_recommendations_input").classList.add("hidden");
      }
    });

    // Autocomplete anime names
    $("#anime_name").on("input", function () {
      const input = this.value.toLowerCase();
      const dataList = document.getElementById("anime_list");
      if (input.length < 2) {
        dataList.innerHTML = "";
        return;
      }
      $.ajax({
        url: `/autocomplete`,
        data: { term: input },
        dataType: "json",
        success: function (data) {
          dataList.innerHTML = "";
          data.forEach(function (animeName) {
            const option = document.createElement("option");
            option.value = animeName;
            dataList.appendChild(option);
          });
        }
      });
    });

    // Disable submit button during fetch
    function setLoading(loading) {
      const btn = document.getElementById('submitBtn');
      btn.disabled = loading;
      if (loading) {
        btn.textContent = "Loading...";
      } else {
        btn.textContent = "Get Recommendations";
      }
    }

    // Scroll to recommendations
    function scrollToRecommendations() {
      const container = document.getElementById('recommendations');
      container.scrollIntoView({ behavior: 'smooth' });
    }

    // Handle form submit
    document.getElementById("recommendForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const recType = document.getElementById("recommendation_type").value;
      const animeName = document.getElementById("anime_name").value.trim();
      const numRecs = +document.getElementById("num_recommendations").value || 10;

      if (!recType) {
        alert("Please select a recommendation type.");
        return;
      }
      if (!animeName) {
        alert("Please enter an anime name.");
        return;
      }
      if (numRecs < 1 || numRecs > 50) {
        alert("Number of recommendations must be between 1 and 50.");
        return;
      }

      setLoading(true);
      document.getElementById("recommendations").innerHTML = `<p class="text-center text-gray-400">Fetching recommendations...</p>`;

      let data = { recommendation_type: recType, num_recommendations: numRecs, anime_name: animeName };

      fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(response => {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then(data => {
        showRecommendations(data);
        scrollToRecommendations();
      })
      .catch(err => {
        console.error("Error:", err);
        document.getElementById("recommendations").innerHTML = `<p class="text-red-400 text-center">Failed to get recommendations.</p>`;
      })
      .finally(() => setLoading(false));
    });

    // Display recommendations, using rec.img (MyAnimeList/Cover URL)
    function showRecommendations(recs) {
      const container = document.getElementById("recommendations");
      if (!recs || recs.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400">No recommendations found.</p>`;
        return;
      }
      container.innerHTML = recs.map(rec => `
        <div class="bg-[#2a2d30] rounded-lg p-5 shadow-xl flex flex-col sm:flex-row gap-4 hover:shadow-[#00ffcc] hover:shadow-lg transition-shadow duration-300 cursor-pointer">
          <img src="${rec.img}" alt="${rec.name}" class="w-32 h-48 object-cover rounded-lg flex-shrink-0"
            onerror="this.onerror=null; this.src='/static/images/placeholder.png';" />
          <div>
            <h2 class="text-2xl font-bold text-[#00ffcc]">${rec.name}</h2>
            <p class="text-sm text-gray-400 mb-2">${rec.genres || '-'}</p>
            <p class="mb-2"><strong>Score:</strong> ${rec.score ?? '-'}</p>
            <p class="text-gray-300">${(rec.synopsis || '').slice(0, 250)}${(rec.synopsis && rec.synopsis.length > 250 ? '...' : '')}</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
