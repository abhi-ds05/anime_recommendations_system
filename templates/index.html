<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnimeVerse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-[#141320] text-white min-h-screen p-6">

  <!-- Header -->
  <header class="flex flex-col sm:flex-row justify-between items-center mb-10">
    <h1 class="text-4xl sm:text-5xl font-extrabold text-pink-400 mb-4 sm:mb-0">
      <span class="text-white">H</span>AnimeVerse
    </h1>
    <form id="recommendForm" class="flex flex-col sm:flex-row gap-4 items-center">
      <select id="recommendation_type" name="recommendation_type" required
        class="rounded-lg px-4 py-2 bg-[#1f1e2e] border border-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
        <option value="">-- Select Type --</option>
        <option value="item_based">Item-based</option>
      </select>

      <input type="text" id="anime_name" name="anime_name" list="anime_list" placeholder="Enter anime name"
        class="rounded-lg px-4 py-2 bg-[#1f1e2e] border border-gray-600 text-white w-64 focus:ring-pink-500 hidden" />
      <datalist id="anime_list"></datalist>

      <input type="number" id="num_recommendations" name="num_recommendations" value="10"
        class="rounded-lg px-4 py-2 bg-[#1f1e2e] border border-gray-600 text-white w-32 focus:ring-pink-500 hidden" />

      <button type="submit"
        class="bg-pink-500 hover:bg-pink-600 text-white font-bold px-6 py-2 rounded-lg transition duration-300 transform hover:scale-105">
        Recommend
      </button>
    </form>
  </header>

  <!-- Recommendations Section -->
  <section id="recommendations" class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-5xl mx-auto"></section>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    document.getElementById("recommendation_type").addEventListener("change", function () {
      const animeInput = document.getElementById("anime_name");
      const numInput = document.getElementById("num_recommendations");

      if (this.value === "item_based") {
        animeInput.classList.remove("hidden");
        numInput.classList.remove("hidden");
      } else {
        animeInput.classList.add("hidden");
        numInput.classList.add("hidden");
      }
    });

    $("#anime_name").on("input", function () {
      const input = this.value.toLowerCase();
      const dataList = document.getElementById("anime_list");

      $.ajax({
        url: `/autocomplete`,
        data: { term: input },
        dataType: "json",
        success: function (data) {
          dataList.innerHTML = "";
          data.forEach(anime => {
            const option = document.createElement("option");
            option.value = anime;
            dataList.appendChild(option);
          });
        }
      });
    });

    document.getElementById("recommendForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const recType = document.getElementById("recommendation_type").value;
      const animeName = document.getElementById("anime_name").value;
      const numRecs = document.getElementById("num_recommendations").value || 10;

      let data = { recommendation_type: recType, num_recommendations: numRecs };
      if (recType === "item_based") data.anime_name = animeName;

      fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(data => showRecommendations(data))
      .catch(() => {
        document.getElementById("recommendations").innerHTML = `
          <p class="text-center text-red-400 col-span-2">Failed to get recommendations.</p>`;
      });
    });

    function showRecommendations(recs) {
      const container = document.getElementById("recommendations");
      if (!recs.length) {
        container.innerHTML = `<p class="text-center text-gray-400 col-span-2">No recommendations found.</p>`;
        return;
      }

      container.innerHTML = recs.map(rec => `
        <div class="bg-[#1e1e2d] rounded-2xl overflow-hidden shadow-lg flex flex-col sm:flex-row p-4 gap-4 border border-[#333] hover:shadow-pink-400/30 transition duration-300">
          <img src="${rec.img}" alt="${rec.name}" class="w-32 h-44 object-cover rounded-xl">
          <div class="flex-1">
            <h3 class="text-2xl font-bold text-pink-400">${rec.name}</h3>
            <p class="text-sm text-gray-400 mb-2">${rec.genres}</p>
            <p class="text-sm mb-1"><strong>Score:</strong> ${rec.score} | <strong>Watched by:</strong> ${rec.users_watched ?? '-'}</p>
            <p class="text-gray-300 text-sm">${rec.synopsis.slice(0, 250)}...</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
